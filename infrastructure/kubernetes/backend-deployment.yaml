apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: fashion-marketplace
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-api
          image: ghcr.io/snehapullagura/fashion-marketplace-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://fashion_user:$(DB_PASSWORD)@postgres-service:5432/fashion_db"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: SECRET_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: fashion-marketplace
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
