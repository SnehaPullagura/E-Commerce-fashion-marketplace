apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fashion-marketplace-ingress
  namespace: fashion-marketplace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - atelier.fashion
        - api.atelier.fashion
        - vendor.atelier.fashion
        - admin.atelier.fashion
      secretName: atelier-tls-certs
  rules:
    - host: api.atelier.fashion
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
    - host: atelier.fashion
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web-service
                port:
                  number: 3000
